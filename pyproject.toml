[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chris-jero-harsha-fla-task-3"
version = "1.0.0"
description = "Pushdown Automata and Context-Free Grammar Case Studies"
requires-python = ">=3.10"
authors = [{name = "Chris Jero Harsha P"}]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["fla_project*"]
